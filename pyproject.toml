[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-safety-observability"
version = "0.1.0"
description = "Runtime-aware Physical AI safety observability pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.13",
  "av>=12",
  "cryptography>=42",
  "fastapi>=0.110",
  "httpx>=0.27",
  "Pillow>=10",
  "pydantic>=2.6",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.16",
]
opencv = [
  "opencv-python-headless>=4.9",
]

[tool.setuptools]
py-modules = ["runtime_settings"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "api*",
  "edge*",
  "rules*",
  "telemetry*",
  "events*",
  "evidence*",
  "spatial*",
  "replay*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Boundaries with libav, sockets, model servers and log handlers: any exception
# there is recorded (redacted) and reported, never allowed to kill the loop.
"edge/capture.py" = ["BLE001", "S110"]
"edge/probe.py" = ["BLE001", "S110"]
"edge/model_guard.py" = ["BLE001"]
"edge/redaction.py" = ["BLE001"]
"edge/service.py" = ["BLE001"]
"edge/poster.py" = ["BLE001"]
